# Copy to config.yaml (gitignored) and edit.
window_days: 7
# licenses: [cc0, cc-by, cc-by-sa]   # optional allow-list; default: any open-access paper with a downloadable PDF
sources: [europepmc, openalex, arxiv, biorxiv]
max_results_per_source: 300
fuzzy_dedupe: true   # merge near-identical titles (e.g. preprint and published version), also against earlier runs
carryover_days: 28   # papers wait this long for an episode when fewer than min_sources were found (0 = drop them)
# contact_email: you@example.org        # or CONTACT_EMAIL in .env (polite pool for OpenAlex/Crossref)

screening:
  # Decision model (Decisions API, probabilities instead of text). "~...-latest" floats to new snapshots;
  # pin e.g. perplexity/pplx-decider-v1.1-27b if thresholds must stay stable.
  model: "~perplexity/pplx-decider-latest"
  min_relevance: 6        # 0-10 scale
  min_quality: 5          # 0-10 scale
  min_engaging: 0.5       # probability
  top_n: 6
  concurrency: 4
  allow_preprints: true

notebooklm:
  delete_notebook: true     # remove the notebook after audio + description are saved (frees NotebookLM space)
  min_sources: 2           # papers NotebookLM must accept to build an episode
  generation_timeout: 1800 # seconds to wait for the audio

site:
  # upload_url: https://example.org/podcast/upload.php   # or SITE_UPLOAD_URL in .env; token: SITE_UPLOAD_TOKEN in .env
  chunk_mb: 8        # max size of one upload request (the server may lower it)
  retries: 4

topics:
  - name: Muscle MRI
    # A paper matches if ANY keyword matches. A keyword matches when ALL its words occur (any order, anywhere in the
    # text); put "double quotes" around words that must stay together as an exact phrase.
    keywords: ["muscle MRI", "skeletal muscle imaging", "quantitative muscle MRI"]
    exclude: []
    podcast:
      format: deep_dive      # deep_dive | brief | critique | debate
      length: default        # short | default | long
      language: en
      instructions: >
        Weekly research digest for MR physicists and clinicians. Name each paper's first author and year,
        distinguish peer-reviewed work from preprints, and be critical about limitations.
