[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-scientific-podcast"
version = "0.1.0"
description = "Find new open-access papers, screen them with an LLM, build a NotebookLM podcast and publish it."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "notebooklm-py[browser]",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "tenacity",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
podcast = "podcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
